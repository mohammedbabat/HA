title: Zuhause
views:
  - title: Zuhause
    path: wall
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      # ---------- 1. WILLKOMMEN ----------
      - type: grid
        column_span: 3
        cards:
          - type: clock
            clock_style: digital
            clock_size: large
            show_seconds: false
            time_format: "24"
            grid_options:
              columns: 6
          - type: markdown
            grid_options:
              columns: 6
            content: >
              {% set h = now().hour %}
              {% if 5 <= h < 12 %}## 🌅 Guten Morgen
              {% elif 12 <= h < 17 %}## ☀️ Guten Tag
              {% elif 17 <= h < 21 %}## 🌆 Guten Abend
              {% else %}## 🌙 Gute Nacht{% endif %}

              ### Mohammed, Habiba & Sila

              {{ now().strftime('%d.%m.%Y') }}
      # ---------- 2. GERÄTE ----------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Geräte
            icon: mdi:lightbulb-group
          - type: button
            name: Wir sind weg
            icon: mdi:home-export-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: perform-action
              perform_action: script.wir_sind_weg
          - type: button
            name: Wir sind da
            icon: mdi:home-import-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: perform-action
              perform_action: script.wir_sind_da
          - type: tile
            entity: light.tradfribulbe27wsglobeclear806lm
            name: Wohnzimmer
            icon: mdi:sofa
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.essen_licht
            name: Essen
            icon: mdi:ceiling-light
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.kuche_licht
            name: Küche
            icon: mdi:ceiling-light
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfri_bulb_e27_cws_globe_806lm_3
            name: Schlafzimmer
            icon: mdi:bed
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfri_bulb_e27_cws_globe_806lm_2
            name: Sila
            icon: mdi:lamp
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfribulbe27wsglobeclear806lm_2
            name: Flur
            icon: mdi:lightbulb
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: switch.balkon_steckdose
            name: Balkon
            icon: mdi:power-socket-eu
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: media_player.babat
            name: TV
            icon: mdi:television
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: heading
            heading: Musik
            icon: mdi:music
          - type: tile
            entity: media_player.wohnzimmerg
            name: Wohnzimmer
            icon: mdi:speaker
            grid_options:
              columns: 4
          - type: tile
            entity: media_player.flur
            name: Flur
            icon: mdi:speaker
            grid_options:
              columns: 4
          - type: tile
            entity: media_player.schlafzimmerg
            name: Schlafzimmer
            icon: mdi:speaker
            grid_options:
              columns: 4
          - type: tile
            entity: media_player.gruppe_music
            name: Alle Boxen
            icon: mdi:speaker
            grid_options:
              columns: 4
      # ---------- 3. INFO ----------
      - type: grid
        cards:
          - type: heading
            heading: Info
            icon: mdi:information
          - type: glance
            show_state: true
            entities:
              - person.habiba
              - person.mbabat
          - type: markdown
            title: ⛽ Tanken · SB Aachener Str.
            content: >
              {% set ents = integration_entities('tankerkoenig')
                 | select('match', 'sensor\\..*aachener') | list %}
              {% if ents | length == 0 %}
              Keine Preise gefunden.
              {% else %}
              {% for e in ents %}
              **{{ state_attr(e, 'friendly_name') }}:**
              {% if states(e) | is_number %}{{ states(e) | float | round(3) }} €{% else %}{{ states(e) }}{% endif %}

              {% endfor %}
              {% endif %}
          - type: entities
            entities:
              - binary_sensor.flowsinsor_belegung
          - type: tile
            entity: binary_sensor.workday_sensor_de
            name: Arbeitstag
          - type: tile
            entity: todo.zuhause
            name: Einkauf & ToDo
