title: Zuhause
views:
  - title: Zuhause
    path: wall
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Willkommen
            icon: mdi:hand-wave
          - type: markdown
            content: >
              {% set h = now().hour %}
              {% if 5 <= h < 12 %}# 🌅 Guten Morgen
              {% elif 12 <= h < 17 %}# ☀️ Guten Tag
              {% elif 17 <= h < 21 %}# 🌆 Guten Abend
              {% else %}# 🌙 Gute Nacht{% endif %}

              # {{ now().strftime('%H:%M') }}

              ### Mohammed, Habiba & Sila

              {{ now().strftime('%d.%m.%Y') }}
      - type: grid
        cards:
          - type: heading
            heading: Geräte
            icon: mdi:lightbulb-group
          - type: button
            name: Alles aus
            icon: mdi:power
            tap_action:
              action: perform-action
              perform_action: script.alles_aus
              confirmation:
                text: Wirklich alles ausschalten?
          - type: tile
            entity: light.tradfribulbe27wsglobeclear806lm
            name: Wohnzimmer
            icon: mdi:sofa
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.essen_licht
            name: Essen
            icon: mdi:ceiling-light
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.kuche_licht
            name: Küche
            icon: mdi:ceiling-light
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfri_bulb_e27_cws_globe_806lm_3
            name: Schlafzimmer
            icon: mdi:bed
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfri_bulb_e27_cws_globe_806lm_2
            name: Sila
            icon: mdi:lamp
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfribulbe27wsglobeclear806lm_2
            name: Flur
            icon: mdi:lightbulb
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: switch.balkon_steckdose
            name: Balkon
            icon: mdi:power-socket-eu
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: media_player.babat
            name: TV
            icon: mdi:television
            vertical: true
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: heading
            heading: Musik
            icon: mdi:speaker
          - type: tile
            entity: media_player.flur
          - type: tile
            entity: media_player.schlafzimmerg
          - type: tile
            entity: media_player.gruppe_music
      - type: grid
        cards:
          - type: heading
            heading: Info
            icon: mdi:information
          - type: glance
            entities:
              - person.habiba
              - person.mbabat
          - type: entities
            entities:
              - binary_sensor.flowsinsor_belegung
          - type: tile
            entity: binary_sensor.workday_sensor_de
          - type: tile
            entity: todo.zuhause
