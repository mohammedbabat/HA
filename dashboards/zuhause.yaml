title: Zuhause
views:
  - title: Zuhause
    path: wall
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      # ---------- 1. WILLKOMMEN ----------
      - type: grid
        column_span: 3
        cards:
          - type: clock
            clock_style: digital
            clock_size: large
            show_seconds: false
            time_format: "24"
            grid_options:
              columns: 6
          - type: markdown
            grid_options:
              columns: 6
            content: >
              {% set h = now().hour %}
              {% if 5 <= h < 12 %}## 🌅 Guten Morgen
              {% elif 12 <= h < 17 %}## ☀️ Guten Tag
              {% elif 17 <= h < 21 %}## 🌆 Guten Abend
              {% else %}## 🌙 Gute Nacht{% endif %}

              ### Mohammed, Habiba & Sila

              {{ now().strftime('%d.%m.%Y') }}
      # ---------- 2. GERÄTE ----------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Schnellaktionen
            icon: mdi:flash
          - type: button
            name: Wir sind weg
            icon: mdi:home-export-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: perform-action
              perform_action: script.wir_sind_weg
          - type: button
            name: Wir sind da
            icon: mdi:home-import-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: perform-action
              perform_action: script.wir_sind_da
          - type: heading
            heading: Lichter
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.tradfribulbe27wsglobeclear806lm
            name: Wohnzimmer
            icon: mdi:sofa
            vertical: true
            color: orange
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.essen_licht
            name: Essen
            icon: mdi:ceiling-light
            vertical: true
            color: orange
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.kuche_licht
            name: Küche
            icon: mdi:ceiling-light
            vertical: true
            color: orange
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfri_bulb_e27_cws_globe_806lm_3
            name: Schlafzimmer
            icon: mdi:bed
            vertical: true
            color: orange
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfri_bulb_e27_cws_globe_806lm_2
            name: Sila
            icon: mdi:lamp
            vertical: true
            color: orange
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.tradfribulbe27wsglobeclear806lm_2
            name: Flur
            icon: mdi:lightbulb
            vertical: true
            color: orange
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            features:
              - type: light-brightness
            features_position: bottom
          - type: heading
            heading: Steckdose & TV
            icon: mdi:power-plug
          - type: tile
            entity: switch.balkon_steckdose
            name: Balkon
            icon: mdi:power-socket-eu
            vertical: true
            color: orange
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: media_player.babat
            name: TV
            icon: mdi:television
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: heading
            heading: Musik
            icon: mdi:music
          - type: button
            name: YouTube Musik
            icon: mdi:youtube
            show_state: false
            grid_options:
              columns: full
              rows: 2
            tap_action:
              action: perform-action
              perform_action: script.youtube_musik
          - type: tile
            entity: media_player.wohnzimmerg
            name: Wohnzimmer
            icon: mdi:speaker
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: media_player.flur
            name: Flur
            icon: mdi:speaker
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: media_player.schlafzimmerg
            name: Schlafzimmer
            icon: mdi:speaker
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: media_player.gruppe_music
            name: Alle Boxen
            icon: mdi:speaker
            vertical: true
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.youtube_musik
            icon_tap_action:
              action: perform-action
              perform_action: script.youtube_musik
            hold_action:
              action: more-info
      # ---------- 3. INFO ----------
      - type: grid
        cards:
          - type: heading
            heading: Info
            icon: mdi:information
          - type: tile
            entity: person.mbabat
            name: Mohammed
            vertical: true
            show_entity_picture: true
            color: green
            grid_options:
              columns: 6
            hold_action:
              action: more-info
          - type: tile
            entity: person.habiba
            name: Habiba
            vertical: true
            show_entity_picture: true
            color: green
            grid_options:
              columns: 6
            hold_action:
              action: more-info
          - type: markdown
            title: ⛽ Tanken · günstig 🟢 bis teuer 🔴
            content: |
              {% set ents = integration_entities('tankerkoenig') | select('match', 'sensor\\.') | list %}
              {% for fuel in ['Super E10', 'Super', 'Diesel'] %}
              {% set ns = namespace(items=[]) %}
              {% for e in ents %}
              {% set n = state_attr(e, 'friendly_name') or '' %}
              {% if n.endswith(fuel) and states(e) | is_number %}
              {% set ns.items = ns.items + [[states(e) | float, n | replace(' ' ~ fuel, '')]] %}
              {% endif %}
              {% endfor %}
              {% set items = ns.items | sort %}
              {% if items %}
              **{{ fuel }}**

              {% for it in items %}
              {% set many = items | length > 1 %}
              {% set icon = '🟢' if (many and loop.first) else ('🔴' if (many and loop.last) else '🟡') %}
              {{ icon }} {{ '█' * ([((it[0] - 1.4) * 25) | round | int, 1] | max) }} **{{ '%.3f' | format(it[0]) }} €** · {{ it[1] }}<br>
              {% endfor %}

              {% endif %}
              {% endfor %}
          - type: entities
            title: ⚡ Strom (Monat)
            entities:
              - entity: sensor.stromverbrauch_monat
                name: Verbrauch
              - entity: sensor.stromkosten_monat
                name: Kosten inkl. Grundpreis
              - entity: sensor.strom_abschlag_differenz
                name: Abschlag 119 € – Kosten
              - type: divider
              - entity: input_number.strom_stand_aktuell
              - entity: input_number.strom_stand_monatsanfang
              - entity: input_number.strom_preis
          - type: markdown
            title: 🌐 Internet-Geschwindigkeit
            content: |
              {% set dl = states('sensor.speedtest_download') %}
              {% set ul = states('sensor.speedtest_upload') %}
              {% set pg = states('sensor.speedtest_ping') %}
              {% if dl | is_number %}
              ⬇️ **Download: {{ dl | float | round(0) | int }} Mbit/s**<br>
              ⬆️ **Upload: {{ ul | float | round(0) | int }} Mbit/s**<br>
              ⏱️ Ping: {{ pg | float | round(0) | int }} ms
              {% else %}
              Noch keine Messung. Einstellungen → Geräte & Dienste → Integration hinzufügen → „Speedtest.net".
              {% endif %}
          - type: markdown
            title: 📶 Im WLAN
            content: |
              {% set d = integration_entities('unifi') | select('match', 'device_tracker\\.') | list %}
              {% set ns = namespace(rows=[]) %}
              {% for e in d %}
              {% if is_state(e, 'home') %}
              {% set n = state_attr(e, 'friendly_name') or e %}
              {% set ip = state_attr(e, 'ip') or '' %}
              {% set ap = state_attr(e, 'ap_mac') or '' %}
              {% set typ = '🔌' if state_attr(e, 'is_wired') else '📶' %}
              {% set ns.rows = ns.rows + [[n, ip, typ]] %}
              {% endif %}
              {% endfor %}
              {% if d | length == 0 %}
              Keine UniFi-Geräte gefunden. In der UniFi-Integration unter „Konfigurieren" das Verfolgen von Clients einschalten.
              {% else %}
              **{{ ns.rows | length }} Geräte verbunden**

              {% for r in ns.rows | sort %}
              {{ r[2] }} **{{ r[0] }}**{% if r[1] %} · {{ r[1] }}{% endif %}<br>
              {% endfor %}
              {% endif %}
          - type: entities
            entities:
              - binary_sensor.flowsinsor_belegung
          - type: tile
            entity: binary_sensor.workday_sensor_de
            name: Arbeitstag
          - type: tile
            entity: todo.zuhause
            name: Einkauf & ToDo
