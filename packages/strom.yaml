# Stromzähler per Hand: Zählerstand eintragen -> Monatsverbrauch und Kosten

input_number:
  strom_stand_aktuell:
    name: Zählerstand aktuell
    icon: mdi:counter
    min: 0
    max: 9999999
    step: 0.1
    mode: box
    unit_of_measurement: kWh
  strom_stand_monatsanfang:
    name: Zählerstand Monatsanfang
    icon: mdi:calendar-start
    min: 0
    max: 9999999
    step: 0.1
    mode: box
    unit_of_measurement: kWh
  strom_preis:
    name: Arbeitspreis (0 = 0,312 €)
    icon: mdi:currency-eur
    min: 0
    max: 2
    step: 0.001
    mode: box
    unit_of_measurement: "€/kWh"

template:
  - sensor:
      - name: Stromverbrauch Monat
        unique_id: strom_verbrauch_monat
        unit_of_measurement: kWh
        icon: mdi:flash
        state: >
          {% set a = states('input_number.strom_stand_aktuell') | float(0) %}
          {% set m = states('input_number.strom_stand_monatsanfang') | float(0) %}
          {{ [a - m, 0] | max | round(1) }}
      - name: Stromkosten Monat
        unique_id: strom_kosten_monat
        unit_of_measurement: "€"
        icon: mdi:cash
        state: >
          {% set p = states('input_number.strom_preis') | float(0) %}
          {% set p = p if p > 0 else 0.312 %}
          {# Grundpreis 173,93 €/Jahr = 14,49 €/Monat #}
          {{ (states('sensor.stromverbrauch_monat') | float(0) * p + 173.93 / 12) | round(2) }}
      - name: Strom Abschlag Differenz
        unique_id: strom_abschlag_differenz
        unit_of_measurement: "€"
        icon: mdi:scale-balance
        # positiv = weniger verbraucht als der Abschlag (119 €/Monat)
        state: >
          {{ (119 - states('sensor.stromkosten_monat') | float(0)) | round(2) }}
