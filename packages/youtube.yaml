# YouTube-Musik: Ton per media_extractor (yt-dlp) direkt als Stream auf die Box schicken.
# Voraussetzung: in configuration.yaml steht die Zeile  media_extractor:
script:
  youtube_musik:
    alias: YouTube Musik
    icon: mdi:youtube
    sequence:
      - action: media_extractor.play_media
        target:
          entity_id: media_player.gruppe_music
        data:
          media_content_type: music
          media_content_id: "https://www.youtube.com/watch?v=I203G1sMGDg"
