# YouTube-Musik per Cast auf die Boxen schicken (ohne Anmeldung in HA)
script:
  youtube_musik:
    alias: YouTube Musik
    icon: mdi:youtube
    sequence:
      - action: media_player.play_media
        target:
          entity_id: media_player.flur
        data:
          media_content_type: cast
          media_content_id: >-
            {"app_name":"youtube","media_id":"I203G1sMGDg","playlist_id":"PLzjs7McP8gqrgalD2shbL6Sf7cvtZ9YhL"}
