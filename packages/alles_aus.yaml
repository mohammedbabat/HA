script:
  alles_aus:
    alias: Alles aus
    icon: mdi:power
    sequence:
      - action: light.turn_off
        target:
          entity_id: all
        continue_on_error: true
      - action: switch.turn_off
        target:
          entity_id: switch.balkon_steckdose
        continue_on_error: true
      - action: media_player.turn_off
        target:
          entity_id:
            - media_player.babat
            - media_player.wohnzimmer
            - media_player.flur
            - media_player.schlafzimmerg
            - media_player.gruppe_music
        continue_on_error: true

  wir_sind_weg:
    alias: Wir sind weg
    icon: mdi:home-export-outline
    sequence:
      - action: script.alles_aus

  wir_sind_da:
    alias: Wir sind da
    icon: mdi:home-import-outline
    sequence:
      - action: light.turn_on
        target:
          entity_id: light.tradfribulbe27wsglobeclear806lm_2
        continue_on_error: true

automation:
  - id: alles_aus_wenn_niemand_zuhause
    alias: Alles aus wenn niemand zuhause
    triggers:
      - trigger: state
        entity_id:
          - person.mbabat
          - person.habiba
        to: not_home
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: person.mbabat
        state: not_home
      - condition: state
        entity_id: person.habiba
        state: not_home
    actions:
      - action: script.alles_aus

  - id: flur_licht_wenn_jemand_in_der_naehe
    alias: Flurlicht an wenn jemand in der Nähe
    triggers:
      - trigger: zone
        entity_id:
          - person.mbabat
          - person.habiba
        zone: zone.naehe
        event: enter
    actions:
      - action: light.turn_on
        target:
          entity_id: light.tradfribulbe27wsglobeclear806lm_2
        continue_on_error: true
